<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>La recepción en 3D (desarrollo)</title>
    <!-- Solo desarrollo: la recepción del Gran Hotel en primera persona (src/features/edificio/hotel/recepcion3d.js), a
         pantalla completa, para verla y capturarla por bloques antes de llevarla a la app. ?yaw=0.5 gira la vista. -->
    <style>
      html, body { margin: 0; height: 100%; background: #14122a; overflow: hidden; }
      #stage { position: fixed; inset: 0; }
      .rcp-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; image-rendering: pixelated; touch-action: none; cursor: grab; }
      .rcp-canvas:focus-visible { outline: 3px solid #ecbe60; outline-offset: -3px; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import { mountRecepcion } from '../src/features/edificio/hotel/recepcion3d.js';
      const yaw = Number(new URLSearchParams(location.search).get('yaw') ?? 0);
      window.__recepcion3d = mountRecepcion(document.getElementById('stage'), { startYaw: yaw });
    </script>
  </body>
