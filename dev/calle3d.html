<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>La calle en 3D (desarrollo)</title>
    <!-- Solo desarrollo: el edificio del puerto visto desde el muelle (src/features/edificio/calle3d.js), a pantalla
         completa, para verlo y capturarlo por bloques antes de llevarlo a la app. ?yaw=0.4 gira la vista; ?vacio=1 deja
         todos los pisos libres. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #36305c;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      .calle-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
        cursor: grab;
      }
      .calle-canvas:focus-visible {
        outline: 3px solid #ecbe60;
        outline-offset: -3px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import { mountCalle } from '../src/features/edificio/calle3d.js';
      const q = new URLSearchParams(location.search);
      const room = {
        pared: 'salvia',
        items: [
          { id: 'estanteria', x: 1 },
          { id: 'planta-grande', x: 2 },
          { id: 'lampara-pie', x: 3 },
          { id: 'sofa', x: 4 },
          { id: 'cuadro', x: 2 },
        ],
      };
      const flats = q.get('vacio')
        ? {}
        : {
            '1A': { room },
            '2B': {
              room: {
                pared: 'rosa',
                items: [
                  { id: 'cama', x: 1 },
                  { id: 'gato', x: 2 },
                  { id: 'guirnalda', x: 3 },
                  { id: 'reloj', x: 2 },
                ],
              },
            },
            '3A': {
              room: {
                pared: 'noche',
                items: [
                  { id: 'sillon', x: 1 },
                  { id: 'planta-pequena', x: 2 },
                  { id: 'estufa', x: 3 },
                ],
              },
            },
          };
      const t0 = performance.now();
      window.__calle3d = mountCalle(document.getElementById('stage'), {
        flats,
        startYaw: Number(q.get('yaw') ?? 0),
      });
      window.__calle3dMs = Math.round(performance.now() - t0);
    </script>
  </body>
</html>
