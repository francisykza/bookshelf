<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>El Gran Hotel en 3D (desarrollo)</title>
    <!-- Solo desarrollo: el Gran Hotel del Puerto visto desde la plaza (src/features/edificio/hotel/hotel3d.js), a pantalla
         completa, para verlo y capturarlo antes de llevarlo a la app. ?yaw=0.4 gira la vista. -->
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0c22;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      .calle-canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        image-rendering: pixelated;
        touch-action: none;
        cursor: grab;
      }
      .calle-canvas:focus-visible {
        outline: 3px solid #ecbe60;
        outline-offset: -3px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script type="module">
      import { mountHotel3d } from '../src/features/edificio/hotel/hotel3d.js';
      const q = new URLSearchParams(location.search);
      const t0 = performance.now();
      window.__hotel3d = mountHotel3d(document.getElementById('stage'), { startYaw: Number(q.get('yaw') ?? 0) });
      window.__hotel3dMs = Math.round(performance.now() - t0);
    </script>
  </body>
</html>
